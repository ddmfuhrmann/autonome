{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block main %}
<div class="page-head"><div class="page-head__text"><h1>Projects</h1><p class="page-head__meta">Projects appear when their first handoff or plan arrives.</p></div></div>
<div class="grid grid--3">
{% for p in projects %}<a class="card" href="/ui/p/{{ p }}"><div class="card__head"><span class="card__title">{{ p }}</span></div></a>
{% else %}<p class="empty">No project yet.</p>{% endfor %}
</div>
{% endblock %}
