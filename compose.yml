name: autonome

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: autonome
      POSTGRES_USER: autonome
      POSTGRES_PASSWORD: autonome
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonome"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
